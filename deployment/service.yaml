# apiVersion: v1
# kind: Service
# metadata:
#   name: hospital_backend_app-service
# spec:
#   selector:
#     app: hospital_backend_app-service
#   ports:
#     - protocol: TCP
#       port: 8080   # The service port exposed internally
#       targetPort: 8080  # Container port where your Spring Boot app listens
#   type: ClusterIP  # Change LoadBalancer to ClusterIP

#--- 
apiVersion: v1
kind: Service
metadata:
  name: hospital-backend-app-service
  labels:
    app: hospital_backend_app
spec:
  selector:
    app: hospital-backend-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
