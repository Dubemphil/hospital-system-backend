# ==============================================================================
# Gitleaks Configuration & Allowlist
# ==============================================================================
title = "Hospital System Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore legacy Kubernetes deployment templates and documentation"
paths = [
  '''(^|/)deployment/.*''',
  '''(^|/)architecture.*''',
  '''(^|/)clusterissuer\.yaml$'''
]
