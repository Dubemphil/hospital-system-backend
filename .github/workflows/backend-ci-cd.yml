name: Hospital System - Backend CI/CD (AWS ECS Fargate)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hospital-system-dev-backend
  ECS_CLUSTER: hospital-system-dev-cluster
  ECS_SERVICE: hospital-system-dev-backend-service

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # Stage 1: Security Scanning, Quality Checks & Compilation
  # ============================================================================
  security-and-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks: Secret Detection
      - name: Run Gitleaks Secret Scanner
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source "$GITHUB_WORKSPACE" --verbose --redact --no-git

      # 2. Hadolint: Dockerfile Best Practice Linter
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # 3. Java Setup & Unit Tests
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Compile and Verify Backend Code
        run: mvn clean compile -B

      # 4. Trivy: Repository & Dependency Vulnerability Scan
      - name: Run Trivy Dependency Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # Stage 2: Build, Push to ECR & Deploy to AWS ECS Fargate (Keyless OIDC)
  # ============================================================================
  build-and-deploy:
    name: Build, Push to ECR & Deploy to ECS
    needs: security-and-quality
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Keyless OIDC Authentication to AWS (Zero permanent credentials)
      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # Authenticate Docker to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image with commit SHA & latest tags
      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image: $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          echo "Pushing image to Amazon ECR..."
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      # Container Image Vulnerability Scan
      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: 'CRITICAL'
          exit-code: '0'

      # Deploy to Amazon ECS Fargate
      - name: Deploy to Amazon ECS Fargate
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
        run: |
          echo "Triggering rolling deployment on ECS Cluster: $CLUSTER, Service: $SERVICE..."
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment

          echo "Waiting for ECS Fargate deployment stability..."
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services $SERVICE

          echo "ECS Service $SERVICE deployment successfully completed!"
