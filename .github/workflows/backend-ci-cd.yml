name: Hospital System - Backend CI/CD (Dev to Prod Promotion)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  DEV_ECR_REPO: hospital-system-dev-backend
  DEV_ECS_CLUSTER: hospital-system-dev-cluster
  DEV_ECS_SERVICE: hospital-system-dev-backend-service
  PROD_ECS_CLUSTER: hospital-system-prod-cluster
  PROD_ECS_SERVICE: hospital-system-prod-backend-service

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # Stage 1: Security Scanning, Quality Checks & Compilation
  # ============================================================================
  security-and-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks: Secret Detection
      - name: Run Gitleaks Secret Scanner
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source "$GITHUB_WORKSPACE" --verbose --redact --no-git

      # 2. Hadolint: Dockerfile Best Practice Linter
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # 3. Java Setup & Unit Tests
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Compile and Verify Backend Code
        run: mvn clean compile -B

      # 4. Trivy: Repository & Dependency Vulnerability Scan
      - name: Run Trivy Dependency Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # Stage 2: Build & Push Immutable Container Image to Amazon ECR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: security-and-quality
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Keyless OIDC Authentication to AWS
      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # Authenticate Docker to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image with commit SHA & latest tags
      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.DEV_ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building immutable Docker image: $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          echo "Pushing image to Amazon ECR..."
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      # Container Image Vulnerability Scan
      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.DEV_ECR_REPO }}:${{ github.sha }}
          severity: 'CRITICAL'
          exit-code: '0'

  # ============================================================================
  # Stage 3: Automated Deployment to DEV Environment (Fargate)
  # ============================================================================
  deploy-dev:
    name: Deploy to DEV Environment (ECS Fargate)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy to DEV Amazon ECS Fargate
        run: |
          echo "Deploying to DEV ECS Cluster: ${{ env.DEV_ECS_CLUSTER }}..."
          aws ecs update-service \
            --cluster ${{ env.DEV_ECS_CLUSTER }} \
            --service ${{ env.DEV_ECS_SERVICE }} \
            --force-new-deployment

          echo "Waiting for DEV ECS Fargate deployment stability..."
          aws ecs wait services-stable \
            --cluster ${{ env.DEV_ECS_CLUSTER }} \
            --services ${{ env.DEV_ECS_SERVICE }}
          echo "DEV deployment verified and stable!"
