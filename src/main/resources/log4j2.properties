# Log4j2 Configuration with HIPAA / PHI Redaction Patterns
status = warn

# Console Appender with Regex PHI Redaction (Phone, SSN, MRN)
appender.console.type = Console
appender.console.name = consoleLogger
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %replace{%replace{%m}{\\b\\d{3}[-.]?\\d{3}[-.]?\\d{4}\\b}{[REDACTED_PHONE]}}{\\b\\d{3}-\\d{2}-\\d{4}\\b}{[REDACTED_SSN]}%n

# Production Root Logger Level (INFO to prevent debug dumps)
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = consoleLogger
