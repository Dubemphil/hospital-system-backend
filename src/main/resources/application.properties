# Database Properties (Environment Variables with Local Dev Defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dental_management_system?createDatabaseIfNotExist=true&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jackson.serialization.fail-on-empty-beans=false

# Server Port
server.port=${PORT:8080}

# Multipart File Upload (Container-safe path)
disk.upload.basepath=${UPLOAD_BASE_PATH:/tmp/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://devopsstandard.name.ng,https://api.devopsstandard.name.ng}
