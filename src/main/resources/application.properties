# ==============================================================================
# Hospital Management System - Spring Boot Backend Configuration
# ==============================================================================

# Database Connection (AWS RDS MySQL / Local Dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dental_management_system?createDatabaseIfNotExist=true&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jackson.serialization.fail-on-empty-beans=false

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Server Port (AWS ECS Fargate container port)
server.port=${PORT:8080}

# Multipart File Upload (Container-safe path)
disk.upload.basepath=${UPLOAD_BASE_PATH:/tmp/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Allowed Origins (Supports custom domain & local dev)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://devopsstandard.name.ng,https://api.devopsstandard.name.ng,http://localhost:3000}
